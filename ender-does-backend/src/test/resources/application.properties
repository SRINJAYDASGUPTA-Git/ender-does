# ------------------------------------------------------------
# Application
# ------------------------------------------------------------
server.servlet.application-display-name=EnderDoes-API-Test
spring.application.name=EnderDoes-Test

# ------------------------------------------------------------
# H2 Database
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:enderdoes-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------
# Hibernate
# ------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=TRACE

# ------------------------------------------------------------
# H2 Console (optional)
# ------------------------------------------------------------
spring.h2.console.enabled=true

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
application.security.jwt.secret-key=test-secret-key-test-secret-key-test-secret-key-test-secret-key
application.security.jwt.expiration=3600000
application.security.jwt.refresh-expiration=31536000000

# ------------------------------------------------------------
# SpringDoc
# ------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false